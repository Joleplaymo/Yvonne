name: vanessagandino

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_BASE_URL: https://${DOMAIN:-localhost}
    volumes:
      - data:/data
    expose:
      - "80"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
